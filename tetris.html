<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Tetris</title>

<style>

body{
background:black;
color:#00ff00;
font-family:monospace;
text-align:center;
margin:0;
}

h1{
margin-top:10px;
}

canvas{
background:#111;
margin-top:10px;
border:4px solid #00ff00;
}

#score{
font-size:20px;
margin-top:10px;
}

#controls{
margin-top:15px;
}

button{
font-size:20px;
margin:5px;
padding:10px 20px;
background:#222;
color:#00ff00;
border:1px solid #00ff00;
}

</style>
</head>

<body>

<h1>SUPER まさリス</h1>

<canvas id="game" width="200" height="400"></canvas>

<div id="score">Score: 0</div>

<div id="controls">
<br>
<button onclick="move(-1)">◀</button>
<button onclick="rotate()">⟳</button>
<button onclick="move(1)">▶</button>
<br>
<button onclick="drop()">▼</button>
</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
ctx.scale(20,20);

const colors=[
null,
"#FF0D72",
"#0DC2FF",
"#0DFF72",
"#F538FF",
"#FF8E0D",
"#FFE138",
"#3877FF"
];

const arena=createMatrix(10,20);

const player={
pos:{x:0,y:0},
matrix:null,
score:0
};

const pieces="TJLOSZI";

function createMatrix(w,h){
const matrix=[];
while(h--){
matrix.push(new Array(w).fill(0));
}
return matrix;
}

function createPiece(type){

if(type==="T"){
return [
[0,1,0],
[1,1,1],
[0,0,0]
];
}

if(type==="O"){
return [
[2,2],
[2,2]
];
}

if(type==="L"){
return [
[0,3,0],
[0,3,0],
[0,3,3]
];
}

if(type==="J"){
return [
[0,4,0],
[0,4,0],
[4,4,0]
];
}

if(type==="I"){
return [
[0,5,0,0],
[0,5,0,0],
[0,5,0,0],
[0,5,0,0]
];
}

if(type==="S"){
return [
[0,6,6],
[6,6,0],
[0,0,0]
];
}

if(type==="Z"){
return [
[7,7,0],
[0,7,7],
[0,0,0]
];
}

}

function drawMatrix(matrix,offset){

matrix.forEach((row,y)=>{
row.forEach((value,x)=>{

if(value!==0){

ctx.fillStyle=colors[value];
ctx.fillRect(x+offset.x,y+offset.y,1,1);

ctx.strokeStyle="#000";
ctx.lineWidth=0.05;
ctx.strokeRect(x+offset.x,y+offset.y,1,1);

}

});
});

}

function draw(){

ctx.fillStyle="#000";
ctx.fillRect(0,0,canvas.width,canvas.height);

drawMatrix(arena,{x:0,y:0});
drawMatrix(player.matrix,player.pos);

}

function merge(arena,player){
player.matrix.forEach((row,y)=>{
row.forEach((value,x)=>{
if(value!==0){
arena[y+player.pos.y][x+player.pos.x]=value;
}
});
});
}

function collide(arena,player){

const m=player.matrix;
const o=player.pos;

for(let y=0;y<m.length;y++){
for(let x=0;x<m[y].length;x++){

if(m[y][x]!==0 &&
(arena[y+o.y] &&
arena[y+o.y][x+o.x])!==0){

return true;

}

}
}

return false;

}

function playerReset(){

const piece=pieces[pieces.length*Math.random()|0];
player.matrix=createPiece(piece);

player.pos.y=0;
player.pos.x=(arena[0].length/2|0)-
(player.matrix[0].length/2|0);

}

function playerDrop(){

player.pos.y++;

if(collide(arena,player)){

player.pos.y--;

merge(arena,player);

arenaSweep();

playerReset();

}

dropCounter=0;

}

function move(dir){

player.pos.x+=dir;

if(collide(arena,player)){
player.pos.x-=dir;
}

}

function rotate(){

const m=player.matrix;

for(let y=0;y<m.length;y++){
for(let x=0;x<y;x++){
[m[x][y],m[y][x]]=[m[y][x],m[x][y]];
}
}

m.forEach(row=>row.reverse());

}

function arenaSweep(){

let rowCount=1;

outer:
for(let y=arena.length-1;y>=0;y--){

for(let x=0;x<arena[y].length;x++){
if(arena[y][x]===0){
continue outer;
}
}

const row=arena.splice(y,1)[0].fill(0);

arena.unshift(row);

y++;

player.score+=rowCount*10;

rowCount*=2;

document.getElementById("score").innerText="Score: "+player.score;

}

}

let dropCounter=0;
let dropInterval=1000;
let lastTime=0;

function update(time=0){

const delta=time-lastTime;

lastTime=time;

dropCounter+=delta;

if(dropCounter>dropInterval){
playerDrop();
}

draw();

requestAnimationFrame(update);

}

function drop(){
playerDrop();
}

playerReset();
update();

</script>

</body>
</html>
