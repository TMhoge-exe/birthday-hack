<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>カオスデュエル</title>

<style>

body{
margin:0;
font-family:serif;
color:white;
background:
linear-gradient(rgba(0,0,0,0.7),rgba(0,0,0,0.7)),
url("https://www.transparenttextures.com/patterns/asfalt-dark.png");
background-color:#1a1a1a;
}

h1{
text-align:center;
font-size:48px;
letter-spacing:5px;
margin:10px;
color:#fff;
text-shadow:0 0 10px orange;
}

.top{
display:flex;
justify-content:space-around;
font-size:24px;
margin-bottom:10px;
}

.field{
height:180px;
border-top:1px solid #888;
border-bottom:1px solid #888;
display:flex;
justify-content:center;
align-items:center;
gap:20px;
}

.hand{
display:flex;
justify-content:center;
gap:20px;
margin-top:20px;
}

.card{
width:120px;
height:180px;
background:#111;
border-radius:10px;
border:3px solid gold;
box-shadow:0 0 10px gold;
cursor:pointer;
display:flex;
flex-direction:column;
overflow:hidden;
transition:.2s;
}

.card:hover{
transform:scale(1.1);
}

.card img{
width:100%;
height:100px;
object-fit:cover;
}

.card-name{
text-align:center;
font-weight:bold;
margin-top:3px;
}

.card-effect{
font-size:12px;
padding:3px;
text-align:center;
}

.deck{
position:absolute;
right:40px;
top:260px;
width:120px;
height:180px;
border-radius:10px;
background:#222;
border:3px solid gold;
display:flex;
justify-content:center;
align-items:center;
font-size:20px;
cursor:pointer;
}

.effect{
position:absolute;
font-size:60px;
color:red;
animation:boom .6s forwards;
}

@keyframes boom{
0%{opacity:0;transform:scale(.5)}
50%{opacity:1;transform:scale(1.3)}
100%{opacity:0;transform:scale(2)}
}

.message{
text-align:center;
font-size:20px;
margin-top:10px;
color:#00ffff;
}

</style>
</head>

<body>

<h1>カオスデュエル</h1>

<div class="top">
<div>プレイヤー ❤️ <span id="playerLife">30</span></div>
<div>CPU ❤️ <span id="cpuLife">30</span></div>
</div>

<div class="message" id="message">ドローしてください</div>

<div class="field" id="field"></div>

<div class="hand" id="hand"></div>

<div class="deck" onclick="drawCard()">ドロー</div>

<script>

let playerLife=30
let cpuLife=30

let drawn=false

const cards=[

{
name:"メテオ",
effect:"5ダメージ",
img:"https://images.unsplash.com/photo-1473929735474-0361a2b7d454",
play(){
cpuLife-=5
effect("☄️")
}
},

{
name:"雷撃",
effect:"3ダメージ",
img:"https://images.unsplash.com/photo-1504384308090-c894fdcc538d",
play(){
cpuLife-=3
effect("⚡")
}
},

{
name:"回復薬",
effect:"5回復",
img:"https://images.unsplash.com/photo-1603398938378-e54eab446dde",
play(){
playerLife+=5
effect("✨")
}
},

{
name:"核爆発",
effect:"8ダメージ",
img:"https://images.unsplash.com/photo-1462331940025-496dfbfc7564",
play(){
cpuLife-=8
effect("💥")
}
}

]

let hand=[]

function startGame(){

for(let i=0;i<3;i++){
drawRandom()
}

renderHand()

}

function drawRandom(){

let c=cards[Math.floor(Math.random()*cards.length)]

hand.push(c)

}

function drawCard(){

if(drawn){
msg("このターンはもうドロー済み")
return
}

drawRandom()

drawn=true

msg("カードをプレイしてください")

renderHand()

}

function renderHand(){

const handDiv=document.getElementById("hand")

handDiv.innerHTML=""

hand.forEach((c,i)=>{

const div=document.createElement("div")

div.className="card"

div.innerHTML=`

<img src="${c.img}">
<div class="card-name">${c.name}</div>
<div class="card-effect">${c.effect}</div>

`

div.onclick=()=>playCard(i)

handDiv.appendChild(div)

})

}

function playCard(i){

if(!drawn){
msg("まずドローしてください")
return
}

const card=hand[i]

hand.splice(i,1)

renderHand()

card.play()

updateLife()

showField(card)

setTimeout(cpuTurn,1000)

drawn=false

}

function showField(card){

const field=document.getElementById("field")

field.innerHTML=""

const div=document.createElement("div")

div.className="card"

div.innerHTML=`

<img src="${card.img}">
<div class="card-name">${card.name}</div>
<div class="card-effect">${card.effect}</div>

`

field.appendChild(div)

}

function cpuTurn(){

const c=cards[Math.floor(Math.random()*cards.length)]

c.play=function(){

playerLife-=Math.floor(Math.random()*6)+2

effect("🔥")

}

c.play()

updateLife()

msg("CPUのターン終了")

setTimeout(()=>{

document.getElementById("field").innerHTML=""

msg("ドローしてください")

},1000)

}

function effect(text){

const e=document.createElement("div")

e.className="effect"

e.innerText=text

e.style.left=Math.random()*80+"%"

e.style.top=Math.random()*50+100+"px"

document.body.appendChild(e)

setTimeout(()=>e.remove(),600)

}

function updateLife(){

document.getElementById("playerLife").innerText=playerLife

document.getElementById("cpuLife").innerText=cpuLife

if(cpuLife<=0){

alert("勝利！！🎉")

location.reload()

}

if(playerLife<=0){

alert("敗北…")

location.reload()

}

}

function msg(t){
document.getElementById("message").innerText=t
}

startGame()

</script>

</body>
</html>
